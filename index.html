<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berke Hazar — işler</title>
<meta name="description" content="Tarayıcıda çalışan, hesap istemeyen, veriyi cihazda bırakan araçlar.">
<meta name="author" content="Berke Hazar">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Berke Hazar — işler">
<meta property="og:description" content="Tarayıcıda çalışan, hesap istemeyen, veriyi cihazda bırakan araçlar.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://berkehazar.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23000'/%3E%3Crect x='6' y='5' width='3.6' height='14' rx='1.8' fill='%23f6f6f3'/%3E%3Ccircle cx='13.6' cy='15' r='4.4' fill='%23f6f6f3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   berke hazar — işler
   monokrom · Bricolage Grotesque + Schibsted Grotesk
   kartlar ekranın ortasında, yapışkan deste halinde
   ============================================================ */

:root{
  color-scheme: dark;

  --bg: #000000;
  --ink: #f6f6f3;
  --ink-2: rgba(246,246,243,.58);
  --ink-3: rgba(246,246,243,.36);

  --line: rgba(255,255,255,.085);
  --line-2: rgba(255,255,255,.16);

  --r-card: 26px;
  --r-pill: 999px;

  --display: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sans: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --shell: 1360px;
  --gutter: clamp(18px, 4.5vw, 64px);
  --head: 78px;

  --card-h: 58vh;
  --card-top: 21vh;

  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-2: cubic-bezier(.4, 0, .2, 1);
}

*,*::before,*::after{ box-sizing: border-box; }

html{
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}

body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection{ background: rgba(255,255,255,.9); color: #000; }
:focus-visible{ outline: 1px solid rgba(255,255,255,.7); outline-offset: 4px; }

a{ color: inherit; }
h1,h2,h3,p,ul,ol{ margin: 0; }
ul,ol{ list-style: none; padding: 0; }

.shell{
  width: 100%;
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

main, footer{ position: relative; z-index: 2; }

.skip{
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 900;
  background: var(--ink);
  color: #000;
  padding: 12px 18px;
  font-size: .85rem;
  border-radius: var(--r-pill);
}
.skip:focus{ left: 12px; top: 12px; }

/* ---------- lav lambası ---------- */

.lava{
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.lava span{
  position: absolute;
  display: block;
  border-radius: 50%;
  will-change: transform;
  background: radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.155) 0%,
    rgba(255,255,255,.132) 10%,
    rgba(255,255,255,.098) 22%,
    rgba(255,255,255,.064) 34%,
    rgba(255,255,255,.037) 46%,
    rgba(255,255,255,.017) 58%,
    rgba(255,255,255,.005) 70%,
    rgba(255,255,255,0) 82%);
}
.lava span:nth-child(1){
  width: 62vmax; height: 62vmax; left: -18vmax; top: -22vmax;
  animation: lava-a 64s ease-in-out infinite alternate;
}
.lava span:nth-child(2){
  width: 54vmax; height: 54vmax; right: -16vmax; bottom: -18vmax;
  animation: lava-b 78s ease-in-out infinite alternate;
}
.lava span:nth-child(3){
  width: 70vmax; height: 70vmax; left: 22vmax; top: 30vmax;
  animation: lava-c 92s ease-in-out infinite alternate;
  opacity: .8;
}
.lava span:nth-child(4){
  width: 44vmax; height: 44vmax; right: 8vmax; top: 6vmax;
  animation: lava-d 70s ease-in-out infinite alternate;
  opacity: .7;
}

@keyframes lava-a{
  0%  { transform: translate3d(0,0,0) scale(1); }
  50% { transform: translate3d(18vw, 24vh, 0) scale(1.16); }
  100%{ transform: translate3d(4vw, 46vh, 0) scale(.94); }
}
@keyframes lava-b{
  0%  { transform: translate3d(0,0,0) scale(1.05); }
  50% { transform: translate3d(-22vw, -18vh, 0) scale(.88); }
  100%{ transform: translate3d(-6vw, -40vh, 0) scale(1.12); }
}
@keyframes lava-c{
  0%  { transform: translate3d(0,0,0) scale(.9); }
  50% { transform: translate3d(-26vw, -28vh, 0) scale(1.14); }
  100%{ transform: translate3d(10vw, -12vh, 0) scale(1); }
}
@keyframes lava-d{
  0%  { transform: translate3d(0,0,0) scale(1); }
  50% { transform: translate3d(-14vw, 30vh, 0) scale(1.2); }
  100%{ transform: translate3d(6vw, 52vh, 0) scale(.86); }
}

/* ---------- başlık ---------- */

.hud{
  position: fixed;
  inset-inline: 0;
  top: 0;
  z-index: 400;
}
.hud__in{
  height: var(--head);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand{
  display: inline-flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  line-height: 1;
  white-space: nowrap;
}
.brand__mark{
  width: 30px;
  height: 30px;
  color: var(--ink);
  transition: transform .8s var(--ease);
}
.brand:hover .brand__mark{ transform: rotate(-8deg); }
.brand__name{
  font-family: var(--display);
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -.035em;
}

.nav{ display: flex; align-items: center; }
.nav a{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  color: var(--ink-2);
  text-decoration: none;
  transition: color .5s var(--ease-2), background-color .5s var(--ease);
}
.nav a svg{ width: 28px; height: 28px; display: block; }
.nav a:hover{ color: var(--ink); background: rgba(255,255,255,.07); }

.hud__bar{
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
}
.hud__bar span{
  display: block;
  height: 1px;
  background: rgba(255,255,255,.55);
  transform: scaleX(var(--p, 0));
  transform-origin: left center;
}

/* ---------- giriş ---------- */

.hero{ height: 130vh; position: relative; }

.hero__pin{
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100svh;
  display: grid;
  align-content: center;
  padding-top: var(--head);
  will-change: transform, opacity, filter;
}

.hero h1{
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(2.6rem, 13.2vw, 12.2rem);
  line-height: .96;
  letter-spacing: -.045em;
}
.ln{ display: block; overflow: hidden; padding: .12em 0 .22em; margin: -.12em 0 -.22em; }
.ln > span{
  display: block;
  transform: translateY(130%);
  animation: rise 1.15s var(--ease) forwards;
}
.ln:nth-child(1) > span{ animation-delay: .08s; }
.ln:nth-child(2) > span{ animation-delay: .16s; }
.ln:nth-child(3) > span{ animation-delay: .24s; }
@keyframes rise{ to{ transform: translateY(0); } }

/* ---------- kartlar ---------- */

.stack{
  position: relative;
  padding-top: 6vh;
  padding-bottom: 10vh;
}

.card{
  position: sticky;
  top: var(--card-top);
  height: var(--card-h);
  margin-bottom: 26vh;
  display: flex;
  flex-direction: column;
  padding: clamp(22px, 3vw, 46px);
  border-radius: var(--r-card);
  border: 1px solid var(--line);
  background-color: #080808;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.008) 55%, rgba(255,255,255,.022));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 50px 120px -70px rgba(0,0,0,1);
  transform-origin: center top;
  will-change: transform, filter;
  overflow: hidden;
}

.card:last-child{ margin-bottom: 0; }

.card__n{
  font-size: .8125rem;
  letter-spacing: .12em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.card__name{
  margin-top: auto;
  padding-top: clamp(14px, 2.4vh, 26px);
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(2.4rem, 9.6vw, 8.6rem);
  line-height: .98;
  letter-spacing: -.045em;
  overflow-wrap: anywhere;
}
.card__name a{ text-decoration: none; transition: opacity .5s var(--ease-2); }
.card__name a:hover{ opacity: .7; }

.card__desc{
  margin-top: clamp(12px, 2vh, 20px);
  max-width: 42ch;
  font-size: 1.125rem;
  line-height: 1.55;
  color: var(--ink-2);
  text-wrap: pretty;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__acts{
  margin-top: auto;
  padding-top: clamp(16px, 2.4vh, 24px);
  display: flex;
  gap: 8px;
}

.btn{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 18px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: rgba(255,255,255,.035);
  color: var(--ink);
  font-size: .875rem;
  text-decoration: none;
  line-height: 1;
  white-space: nowrap;
  transition:
    background-color .55s var(--ease),
    border-color .55s var(--ease),
    color .55s var(--ease);
}
.btn svg{ transition: transform .55s var(--ease), opacity .55s var(--ease); opacity: .65; }
.btn:hover{ background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.28); }
.btn:hover svg{ transform: translate(1.5px, -1.5px); opacity: 1; }

.btn--solid{
  background: rgba(255,255,255,.92);
  border-color: transparent;
  color: #000;
}
.btn--solid:hover{ background: #fff; border-color: transparent; }
.btn--solid svg{ opacity: .85; }

.rail{
  position: fixed;
  right: clamp(12px, 1.8vw, 26px);
  top: 50%;
  transform: translateY(-50%);
  z-index: 350;
  display: flex;
  flex-direction: column;
  gap: 9px;
  opacity: 0;
  transition: opacity .7s var(--ease-2);
  pointer-events: none;
}
.rail.is-on{ opacity: 1; }
.rail span{
  display: block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,.26);
  transition: background-color .7s var(--ease-2), transform .7s var(--ease);
}
.rail span.is-active{ background: rgba(255,255,255,.95); transform: scale(1.55); }

/* ---------- alt ---------- */

.foot{ padding-block: clamp(56px, 10vh, 110px) clamp(28px, 5vh, 52px); }
.foot__in{
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px 24px;
  padding-top: clamp(28px, 4vh, 44px);
  border-top: 1px solid var(--line);
}
.foot__link{
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.5rem, 3.8vw, 3rem);
  line-height: 1.1;
  letter-spacing: -.04em;
  text-decoration: none;
  transition: opacity .5s var(--ease-2);
  overflow-wrap: anywhere;
}
.foot__link:hover{ opacity: .62; }
.foot__meta{ font-size: .875rem; color: var(--ink-3); }

/* ---------- hareket azaltma ---------- */

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  *,*::before,*::after{
    animation-duration: .001ms !important;
    animation-delay: 0ms !important;
    transition-duration: .001ms !important;
  }
  .ln > span{ transform: none; }
  .hero{ height: auto; }
  .hero__pin{ position: static; height: auto; padding-block: calc(var(--head) + 80px) 80px; }
  .card{ position: static; height: auto; transform: none !important; filter: none !important; margin-bottom: 24px; }
  .rail{ display: none; }
  .lava span{ animation: none; }
}

/* ---------- duyarlı ---------- */

@media (max-width: 900px){
  .rail{ display: none; }
  :root{ --card-h: 62vh; --card-top: 16vh; }
  .card{ margin-bottom: 20vh; }
}

@media (max-width: 620px){
  :root{ --head: 66px; --r-card: 22px; --card-h: 58vh; --card-top: 17vh; }
  .hero h1{ font-size: clamp(2.5rem, 17.4vw, 5rem); }
  .brand__name{ font-size: 1.06rem; }
  .brand__mark{ width: 26px; height: 26px; }
  .card{ padding: 20px; margin-bottom: 16vh; }
  .card__name{ font-size: clamp(2.4rem, 16.4vw, 4rem); }
  .card__desc{ font-size: 1.0625rem; }
  .card__acts{ width: 100%; }
  .btn{ flex: 1; justify-content: center; }
  .foot__in{ flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="lava" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<a class="skip" href="#isler">işlere geç</a>

<header class="hud">
  <div class="shell hud__in">
    <a class="brand" href="#top" aria-label="Berke Hazar">
      <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.2" y="2.4" width="4.4" height="19.2" rx="2.2" fill="currentColor"/>
        <circle cx="13.6" cy="15.2" r="6.4" fill="currentColor"/>
      </svg>
      <span class="brand__name">berke hazar</span>
    </a>
    <nav class="nav" aria-label="Bağlantılar">
      <a href="https://github.com/BerkeHazar" rel="me noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
        </svg>
      </a>
    </nav>
  </div>
  <div class="hud__bar" aria-hidden="true"><span id="progress"></span></div>
</header>

<div class="rail" id="rail" aria-hidden="true"></div>

<main id="top">

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__pin" id="hero-pin">
      <div class="shell">
        <h1 id="hero-title">
          <span class="ln"><span>tarayıcıda</span></span>
          <span class="ln"><span>çalışan</span></span>
          <span class="ln"><span>araçlar.</span></span>
        </h1>
      </div>
    </div>
  </section>

  <section id="isler" aria-label="İşler">
    <div class="shell">
      <div class="stack" id="stack"></div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="shell">
    <div class="foot__in">
      <a class="foot__link" href="https://github.com/BerkeHazar" rel="me noopener">github.com/BerkeHazar</a>
      <span class="foot__meta">© 2026</span>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var USER = "BerkeHazar";
  var API = "https://api.github.com/users/" + USER + "/repos?per_page=100&sort=pushed";
  var CACHE_KEY = "bh-repos-v8";
  var TTL = 6 * 60 * 60 * 1000;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stackEl = document.getElementById("stack");
  var railEl = document.getElementById("rail");

  var FALLBACK = [
    { name: "Lumen", desc: "Çevrimdışı Türkçe–İngilizce sözlük. Hesap yok, reklam yok.", live: "https://berkehazar.github.io/Lumen/", repo: "https://github.com/BerkeHazar/Lumen" },
    { name: "HStream", desc: "Android ve Android TV için IPTV oynatıcısı.", live: "https://berkehazar.github.io/HStream/", repo: "https://github.com/BerkeHazar/HStream" },
    { name: "fastpdf", desc: "Birleştir, böl, döndür. Dosyalar cihazından çıkmaz.", live: "https://berkehazar.github.io/fastpdf/", repo: "https://github.com/BerkeHazar/fastpdf" },
    { name: "ScreenFast", desc: "Cihazdan cihaza dosya aktarımı. Sunucu yok.", live: "https://berkehazar.github.io/ScreenFast/", repo: "https://github.com/BerkeHazar/ScreenFast" },
    { name: "VocaStride", desc: "Kelime öğrenmeyi alışkanlığa çeviren çalışma aracı.", live: "https://berkehazar.github.io/VocaStride/", repo: "https://github.com/BerkeHazar/VocaStride" },
    { name: "nook", desc: "TYT, AYT ve YDT için çalışma takibi.", live: "https://berkehazar.github.io/nook/", repo: "https://github.com/BerkeHazar/nook" }
  ];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function shape(repos) {
    return repos
      .filter(function (r) { return !r.fork && !r.archived && r.name.indexOf(".github.io") === -1; })
      .sort(function (a, b) { return new Date(b.pushed_at) - new Date(a.pushed_at); })
      .map(function (r) {
        return {
          name: r.name,
          desc: r.description || "",
          live: r.homepage || "",
          repo: r.html_url
        };
      });
  }

  var ARROW = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9L9 3M9 3H4.2M9 3v4.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderCards(items) {
    stackEl.innerHTML = items.map(function (it, i) {
      var href = it.live || it.repo;
      return '<article class="card">' +
        '<span class="card__n">' + pad(i + 1) + "</span>" +
        '<h2 class="card__name"><a href="' + esc(href) + '">' + esc(it.name) + "</a></h2>" +
        '<p class="card__desc">' + esc(it.desc) + "</p>" +
        '<div class="card__acts">' +
          (it.live ? '<a class="btn" href="' + esc(it.live) + '">aç ' + ARROW + "</a>" : "") +
          '<a class="btn btn--solid" href="' + esc(it.repo) + '">kod ' + ARROW + "</a>" +
        "</div>" +
      "</article>";
    }).join("");

    railEl.innerHTML = items.map(function () { return "<span></span>"; }).join("");
  }

  function render(items) {
    if (!items || !items.length) return;
    renderCards(items);
    measure();
  }

  /* ---------- ölçüm ---------- */

  var heroPin = document.getElementById("hero-pin");
  var cards = [], cardTops = [], railDots = [];
  var M = { vh: 0, docH: 0, heroH: 0 };
  var lastPaintY = -1;

  function docTop(el) {
    var y = 0;
    while (el) { y += el.offsetTop; el = el.offsetParent; }
    return y;
  }

  function measure() {
    M.vh = window.innerHeight;
    M.docH = document.documentElement.scrollHeight;
    M.heroH = document.querySelector(".hero").offsetHeight;

    cards = Array.prototype.slice.call(stackEl.children);
    cardTops = cards.map(docTop);
    railDots = Array.prototype.slice.call(railEl.children);
    lastPaintY = -1;
  }

  /* ---------- döngü ---------- */

  var bar = document.getElementById("progress");
  var lerpY = window.scrollY;
  var raf = null;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function frame() {
    var y = window.scrollY;
    lerpY += (y - lerpY) * 0.11;
    if (Math.abs(y - lerpY) < 0.08) lerpY = y;

    if (lerpY === lastPaintY) { raf = requestAnimationFrame(frame); return; }
    lastPaintY = lerpY;

    var vh = M.vh;
    var max = M.docH - vh;
    bar.style.setProperty("--p", (max > 0 ? clamp(y / max, 0, 1) : 0).toFixed(4));

    var hp = clamp(lerpY / (M.heroH - vh || 1), 0, 1);
    heroPin.style.transform = "translate3d(0," + (-hp * 60).toFixed(1) + "px,0) scale(" + (1 - hp * 0.04).toFixed(4) + ")";
    heroPin.style.opacity = (1 - hp * 1.02).toFixed(3);
    heroPin.style.filter = hp > 0.01 ? "blur(" + (hp * 8).toFixed(2) + "px)" : "none";

    var active = -1;
    for (var c = 0; c < cards.length; c++) {
      var nextTop = c + 1 < cards.length ? (cardTops[c + 1] - lerpY) : Infinity;
      var cp = nextTop === Infinity ? 0 : clamp((vh * 0.78 - nextTop) / (vh * 0.55), 0, 1);
      var sc = 1 + ((0.94 + c * 0.008) - 1) * cp;
      cards[c].style.transform = "translate3d(0," + (-14 * cp).toFixed(1) + "px,0) scale(" + sc.toFixed(4) + ")";
      cards[c].style.filter = cp > 0.4 ? "blur(" + ((cp - 0.4) * 6).toFixed(2) + "px)" : "none";
      cards[c].style.opacity = (1 - 0.14 * cp).toFixed(3);
      cards[c].style.visibility = cp > 0.995 ? "hidden" : "visible";
      if (cardTops[c] - lerpY <= vh * 0.5) active = c;
    }

    if (railDots.length) {
      var on = (cardTops[0] - lerpY) < vh * 0.5 &&
               (cardTops[cardTops.length - 1] - lerpY) > -vh * 0.5;
      railEl.classList.toggle("is-on", on);
      for (var d = 0; d < railDots.length; d++) {
        railDots[d].classList.toggle("is-active", d === active);
      }
    }

    raf = requestAnimationFrame(frame);
  }

  /* ---------- veri ---------- */

  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}

  if (cached && cached.data && cached.data.length) {
    render(cached.data);
  } else {
    render(FALLBACK);
  }

  if (!cached || !cached.at || Date.now() - cached.at > TTL) {
    fetch(API, { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      })
      .then(function (data) {
        var items = shape(Array.isArray(data) ? data : []);
        if (!items.length) throw new Error("empty");
        render(items);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data: items })); } catch (e) {}
      })
      .catch(function () {});
  }

  /* ---------- başlat ---------- */

  measure();
  window.addEventListener("load", measure);

  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(measure, 160);
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  if (!reduce) {
    frame();
  } else {
    window.addEventListener("scroll", function () {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.setProperty("--p", (max > 0 ? clamp(window.scrollY / max, 0, 1) : 0).toFixed(4));
    }, { passive: true });
  }
})();
</script>

</body>
</html>
