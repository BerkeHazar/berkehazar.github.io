<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berke Hazar - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0a1e;
            --card-bg: #1a1232;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-dark: #6d28d9;
            --text: #e9d5ff;
            --text-dim: #9ca3af;
            --border: #2d1f4a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Fluid Background Animation */
        .fluid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: blob 25s infinite ease-in-out;
        }

        .blob1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, #8b5cf6, #6d28d9);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #a78bfa, #8b5cf6);
            bottom: -100px;
            right: -100px;
            animation-delay: -8s;
        }

        .blob3 {
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #6d28d9, #5b21b6);
            top: 50%;
            left: 50%;
            animation-delay: -16s;
        }

        @keyframes blob {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
            }
            33% { 
                transform: translate(150px, -150px) scale(1.1);
            }
            66% { 
                transform: translate(-100px, 100px) scale(0.9);
            }
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        header {
            padding: 5rem 0 4rem;
            text-align: center;
        }

        .name {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: fadeInUp 0.8s ease;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-dim);
            font-weight: 400;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            animation: fadeInUp 0.8s ease 0.4s backwards;
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
            background: rgba(139, 92, 246, 0.05);
            backdrop-filter: blur(10px);
        }

        .social-links a:hover {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            color: var(--accent-light);
        }

        .social-links a i {
            transition: transform 0.3s ease;
        }

        .social-links a:hover i {
            transform: scale(1.1);
        }

        /* Section Title */
        .section-title {
            font-size: 2rem;
            margin: 5rem 0 2.5rem;
            color: var(--accent-light);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            font-size: 1.75rem;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-dim);
            font-size: 1rem;
        }

        .loading-dots {
            display: inline-block;
            animation: loading 1.4s infinite;
        }

        @keyframes loading {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 5rem;
        }

        .project-card {
            background: rgba(26, 18, 50, 0.6);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
            background: rgba(26, 18, 50, 0.8);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .project-title {
            font-size: 1.35rem;
            color: var(--text);
            font-weight: 600;
            word-break: break-word;
            flex: 1;
            min-width: 0;
        }

        .project-language {
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-light);
            border-radius: 6px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .project-description {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .project-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .stat i {
            color: var(--accent);
        }

        .project-link {
            color: var(--accent-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .project-link:hover {
            color: var(--accent);
            gap: 0.8rem;
        }

        .project-link i {
            transition: transform 0.3s ease;
        }

        .project-link:hover i {
            transform: translateX(4px);
        }

        /* Skills Section */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 5rem;
        }

        .skill-tag {
            font-size: 1rem;
            padding: 0.8rem 1.4rem;
            background: rgba(139, 92, 246, 0.1);
            border: 1.5px solid var(--border);
            color: var(--accent-light);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .skill-tag i {
            font-size: 1.1rem;
        }

        .skill-tag:hover {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 4rem 0 3rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            border-top: 1.5px solid var(--border);
            margin-top: 3rem;
        }

        .footer-text {
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 4rem 0;
            color: #ef4444;
        }

        .error-state a {
            color: var(--accent-light);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .name {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .social-links {
                flex-wrap: wrap;
            }

            .container {
                padding: 0 1.5rem;
            }

            .section-title {
                font-size: 1.75rem;
                margin: 4rem 0 2rem;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .project-card {
                padding: 1.5rem;
            }

            .project-title {
                font-size: 1.2rem;
            }

            header {
                padding: 3rem 0 2.5rem;
            }

            .social-links a {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Fluid Background -->
    <div class="fluid-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- Content -->
    <div class="container">
        <header>
            <h1 class="name">Berke Hazar</h1>
            <p class="subtitle">Front-End Developer</p>
            
            <div class="social-links">
                <a href="https://github.com/BerkeHazar" target="_blank" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </header>

        <main>
            <h2 class="section-title">
                <i class="fas fa-folder-open"></i>
                Projects
            </h2>
            <div id="projectsContainer">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    Loading projects<span class="loading-dots">...</span>
                </div>
            </div>

            <h2 class="section-title">
                <i class="fas fa-code"></i>
                Tech Stack
            </h2>
            <div class="skills-container">
                <span class="skill-tag">
                    <i class="fab fa-js"></i>
                    JavaScript
                </span>
                <span class="skill-tag">
                    <i class="fab fa-react"></i>
                    React
                </span>
                <span class="skill-tag">
                    <i class="fab fa-html5"></i>
                    HTML5
                </span>
                <span class="skill-tag">
                    <i class="fab fa-css3-alt"></i>
                    CSS3
                </span>
                <span class="skill-tag">
                    <i class="fab fa-git-alt"></i>
                    Git
                </span>
                <span class="skill-tag">
                    <i class="fas fa-mobile-alt"></i>
                    Responsive Design
                </span>
            </div>
        </main>

        <footer>
            <p class="footer-text">
                <i class="fas fa-heart" style="color: #ef4444;"></i>
                Made with love and coffee
                <i class="fas fa-mug-hot"></i>
            </p>
        </footer>
    </div>

    <script>
        // GitHub API Integration
        async function fetchGitHubProjects() {
            const username = 'BerkeHazar';
            const container = document.getElementById('projectsContainer');
            
            try {
                const response = await fetch(
                    `https://api.github.com/users/${username}/repos?sort=updated&per_page=6`
                );
                
                if (!response.ok) throw new Error('GitHub API error');
                
                const repos = await response.json();
                
                if (repos.length === 0) {
                    container.innerHTML = `
                        <div class="loading-state">
                            <i class="fas fa-folder-open"></i>
                            No projects found
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '<div class="projects-grid"></div>';
                const grid = container.querySelector('.projects-grid');

                repos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    
                    const description = repo.description || 'No description available';
                    const shortDesc = description.length > 120 
                        ? description.substring(0, 120) + '...' 
                        : description;
                    
                    card.innerHTML = `
                        <div class="project-header">
                            <h3 class="project-title">${repo.name}</h3>
                            ${repo.language ? 
                                `<span class="project-language">${repo.language}</span>` 
                                : ''
                            }
                        </div>
                        <p class="project-description">${shortDesc}</p>
                        <div class="project-stats">
                            <span class="stat">
                                <i class="fas fa-star"></i>
                                ${repo.stargazers_count}
                            </span>
                            <span class="stat">
                                <i class="fas fa-code-branch"></i>
                                ${repo.forks_count}
                            </span>
                        </div>
                        <a href="${repo.html_url}" 
                           target="_blank" 
                           class="project-link">
                            <i class="fab fa-github"></i>
                            View on GitHub 
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    `;
                    
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load projects. Visit 
                        <a href="https://github.com/${username}" target="_blank">
                            <i class="fab fa-github"></i>
                            GitHub
                        </a> 
                        directly.
                    </div>
                `;
            }
        }

        // Load projects on page load
        fetchGitHubProjects();

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }
            });
        });
    </script>
</body>
</html>
